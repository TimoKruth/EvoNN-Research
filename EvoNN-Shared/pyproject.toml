[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evonn-shared"
version = "0.0.0"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
description = "B0 shared contract substrate skeleton for EvoNN"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1,<3",
    "duckdb>=1.1,<2",
    "pydantic>=2.11,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
datasets = ["numpy==2.4.4", "scipy==1.17.1", "scikit-learn==1.8.0", "pandas==3.0.2", "openml==0.15.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/evonn_shared"]
