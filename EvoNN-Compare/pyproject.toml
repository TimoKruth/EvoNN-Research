[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evonn-compare"
version = "0.0.0"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
description = "File-based fair comparison and evidence reports for EvoNN"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["evonn-shared", "numpy==2.4.4", "scipy==1.17.1"]

[project.scripts]
evonn-compare = "evonn_compare.cli:main"

[tool.uv.sources]
evonn-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/evonn_compare"]
