name: B0 macOS engine lane

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-engines:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Install pinned uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.5.13"
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Synchronize locked workspace
        run: uv sync --all-packages --group dev --locked
      - name: Run complete Shared foundation checks
        run: scripts/ci/foundation-checks.sh
      - name: Assert Apple Silicon host and MLX installation
        run: |
          test "$(uname -m)" = "arm64"
          uv run --locked --all-packages --group dev python -c "import platform; assert platform.machine() == 'arm64'"
          uv pip show mlx
      - name: Generate and validate synthetic integrity evidence
        run: |
          uv run --locked --all-packages --group dev python EvoNN-Shared/tests/integrity_probe.py \
            --work-root .artifacts/reference-integrity/runs \
            --output .artifacts/reference-integrity/report.json
          uv run --locked --all-packages --group dev python EvoNN-Shared/tests/integrity_probe.py \
            --validate .artifacts/reference-integrity/report.json
      - name: Upload synthetic integrity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b0-macos-synthetic-integrity
          path: .artifacts/reference-integrity/report.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Rehydrate declared evidence dependencies
        run: uv run --locked --all-packages --group dev evonn-compare evidence hydrate-declared
      - name: Validate registry and PR decision evidence
        run: uv run --locked --all-packages --group dev evonn-compare evidence pr-policy --event "$GITHUB_EVENT_PATH"
      - name: Verify versioned real registry transport
        env:
          EVONN_REGISTRY_TRANSPORT: "1"
        run: uv run --locked --all-packages --group dev pytest -q tests/integration/test_phase3_transport.py
      - name: Run common B0 policies
        run: scripts/ci/b0-policy-checks.sh
      - name: Run macOS engine checks
        run: |
          scripts/ci/prism-checks.sh
          scripts/ci/topograph-checks.sh
          scripts/ci/stratograph-checks.sh
          scripts/ci/primordia-checks.sh
      - name: Verify real engine resume, replay and Compare integration
        env:
          EVONN_TEST_BACKEND: mlx_native
        run: uv run --locked --all-packages --group dev pytest -q tests/integration/test_phase2_runtime.py tests/integration/test_phase2_failures.py tests/integration/test_search_snapshot_ownership.py
      - name: Execute and validate MLX runtime probe
        run: |
          uv run --locked --all-packages --group dev python scripts/ci/runtime_probe.py generate \
            --backend mlx \
            --system stratograph \
            --manifest EvoNN-Stratograph/backend-capabilities.json \
            --output .artifacts/b0/hosted/b0-runtime-probe.json \
            --execution-mode hosted
          uv run --locked --all-packages --group dev python scripts/ci/runtime_probe.py validate \
            --input .artifacts/b0/hosted/b0-runtime-probe.json \
            --execution-mode hosted \
            --expected-backend mlx
      - name: Upload macOS runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b0-macos-runtime-probe
          path: .artifacts/b0/hosted/b0-runtime-probe.json
          if-no-files-found: error
